name: 问题反馈
description: 记录个人产品工作台中可以复现的问题
title: "[问题] "
body:
  - type: textarea
    attributes:
      label: 出现了什么问题
      description: 请说明你看到的结果，以及原本希望看到的结果。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 如何复现
      description: 请按顺序写出操作步骤。
      placeholder: |
        1. 打开需求池
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 截图或补充信息
      description: 可以粘贴截图；请勿上传密码、密钥或真实用户隐私数据。
  - type: dropdown
    attributes:
      label: 使用环境
      options:
        - 本地电脑
        - 私有服务器
        - 其他
    validations:
      required: true
